name: CI

on:
  push:
    branches: [ "main", "develop", "refactor/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run tests with pytest
      env:
        # API Keys (Mock)
        GPT4O_MINI_API_KEY: "mock-key"
        GPT4O_API_KEY: "mock-key"
        EMBEDDING_API_KEY: "mock-key"
        GPT41_API_KEY: "mock-key"
        CLAUDE_4_SONNET_API_KEY: "mock-key"
        CLAUDE_35_HAIKU_API_KEY: "mock-key"

        # Base URLs (Mock)
        GPT4O_MINI_BASE_URL: "https://mlapi.run/mock/v1"
        GPT4O_BASE_URL: "https://mlapi.run/mock/v1"
        EMBEDDING_BASE_URL: "https://mlapi.run/mock/v1"
        GPT41_BASE_URL: "https://mlapi.run/mock/v1"
        CLAUDE_4_SONNET_BASE_URL: "https://mlapi.run/mock/v1"
        CLAUDE_35_HAIKU_BASE_URL: "https://mlapi.run/mock/v1"

        # Models
        GPT4O_MINI_MODEL: "openai/gpt-4o-mini"
        GPT4O_MODEL: "openai/gpt-4o"
        EMBEDDING_MODEL: "text-embedding-3-small"
        GPT41_MODEL: "openai/gpt-4.1"
        CLAUDE_4_SONNET_MODEL: "anthropic/claude-sonnet-4"
        CLAUDE_35_HAIKU_MODEL: "anthropic/claude-3-5-haiku"
      run: |
        pytest --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

    - name: Publish Coverage Summary to GitHub Step Summary
      if: always()
      run: |
        python scripts/generate_coverage_summary.py

    - name: Upload Coverage Reports Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage-report
        path: |
          coverage.xml
          htmlcov/
        if-no-files-found: warn

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: always() && hashFiles('coverage.xml') != ''
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false

  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: web_ui/package-lock.json

    - name: Install frontend dependencies
      working-directory: web_ui
      run: npm ci

    - name: Run Vitest with coverage
      working-directory: web_ui
      run: npm run test:coverage

    - name: Publish Frontend Coverage Summary to GitHub Step Summary
      if: always()
      working-directory: web_ui
      run: |
        SUMMARY_FILE="coverage/coverage-summary.json"
        if [ ! -f "$SUMMARY_FILE" ]; then
          echo "## ⚠️ Frontend Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "커버리지 데이터를 찾을 수 없습니다 (\`${SUMMARY_FILE}\` 없음)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        TOTAL_LINES=$(node -e "const d=require('./${SUMMARY_FILE}');const t=d.total;console.log(t.lines.pct + '% (' + t.lines.covered + '/' + t.lines.total + ')')" 2>/dev/null || echo "N/A")
        TOTAL_STMTS=$(node -e "const d=require('./${SUMMARY_FILE}');const t=d.total;console.log(t.statements.pct + '% (' + t.statements.covered + '/' + t.statements.total + ')')" 2>/dev/null || echo "N/A")
        TOTAL_FUNCS=$(node -e "const d=require('./${SUMMARY_FILE}');const t=d.total;console.log(t.functions.pct + '% (' + t.functions.covered + '/' + t.functions.total + ')')" 2>/dev/null || echo "N/A")
        TOTAL_BRANCHES=$(node -e "const d=require('./${SUMMARY_FILE}');const t=d.total;console.log(t.branches.pct + '% (' + t.branches.covered + '/' + t.branches.total + ')')" 2>/dev/null || echo "N/A")

        {
          echo "## 🧪 Frontend Coverage Report"
          echo ""
          echo "| Metric | Coverage |"
          echo "|:-------|:---------|"
          echo "| Lines | ${TOTAL_LINES} |"
          echo "| Statements | ${TOTAL_STMTS} |"
          echo "| Functions | ${TOTAL_FUNCS} |"
          echo "| Branches | ${TOTAL_BRANCHES} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Frontend Coverage Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage-report
        path: web_ui/coverage/
        if-no-files-found: warn
